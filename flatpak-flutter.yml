id: com.rwkvzone.chat
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm19
command: zone
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
modules:
  - name: chat
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
      append-path: /usr/lib/sdk/llvm19/bin:/run/build/chat/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm19/lib
      env:
        PUB_CACHE: /run/build/chat/.pub-cache
    build-commands:
      - touch .env
      - touch assets/filter.txt
      - flutter build linux --release
      - install -D $BUNDLE_PATH/zone /app/bin/zone
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
    sources:
      - type: git
        url: https://github.com/RWKV-APP/RWKV_APP.git
        commit: 8580be6331fd76f1aeca699c3d8ae1dfe1a2e628
      - type: patch
        path: patches/pubspec.patch
        dest: .
      - type: git
        url: https://github.com/MollySophia/rwkv_mobile_flutter.git
        commit: c2c7f32b427c5d3e3a70b481b789dea35fb8a7b4
        dest: rwkv_mobile_flutter
      - type: git
        url: https://github.com/RWKV-APP/rwkv_downloader.git
        commit: d4b90eaf5185cd15325d18f4ddff5c06224568b0
        dest: rwkv_downloader
      - type: git
        url: https://github.com/HaloWang/photo_viewer.git
        commit: 4106be8e5dcc6911c911152a79bd9446715af9e8
        dest: photo_viewer
      - type: git
        url: https://github.com/pvsvamsi/Disable-Battery-Optimizations.git
        commit: 3bd744d03c416859bbaedecd61c1c11fc022ed75
        dest: disable_battery_optimization
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.32.8
        dest: flutter

